<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .table tbody tr:last-child td {
            border-bottom: none;
        }

        .cards {
            transition: transform 0.3s;

        }

        .cards:hover {
            transform: scale(1.05);
        }

        .fundoInscrever {

            background-color: #f3f3f3;
        }

        button {

            margin-top: 10px;
            margin-right: 5px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            color: #725f88;

        }




        button[type="submit"],
        button[type="reset"] {
            background-color: white;
            float: right;
            padding: 5px;
        }

        button[type="submit"]:hover {
            background-color: #fae3e3;
        }

        button[type="reset"]:hover {
            background-color: #fae3e3;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 1px rgba(0, 0, 0, 0.1);
        }

        .input{

            border: 1px rgb(131, 131, 131) solid;

        }

        @media (min-width: 768px) {
            .menu {
                gap: 50px;

            }
        }

        .form-control {
            border: 1px rgb(131, 131, 131) solid;
        }
    </style>

    <title>CatAdvice</title>
</head>

<body style="background-color: #e8e6f0;">


    <nav class=" flex-column ps-5 pe-5 navbar navbar-expand-sm navbar-dark " style="background-color: #f2a2a2;">

        <div style="color: #4b3f59;">
            <h1 class="h1 text-center">A HISTORIA DOS GATOS</h1>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon "></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto pb-2 menu ">
                <li class="nav-item">
                    <a href="../index.html" class="nav-link">Inicio</a>
                </li>

                <li class="nav-item">
                    <a href="pages/dicas.html" class="nav-link">Dicas</a>
                </li>

                <li class="nav-item">
                    <a href="../pages/inscrever.html" class="nav-link">Inscreva-se</a>
                </li>

            </ul>

        </div>
    </nav>


    <section class="d-flex justify-content-center p-5">


        <div class="bg-white rounded shadow p-5 w-100" style="max-width: 600px;">

            <h2 class="text-center pb-5 pt-1">Cadastra-se</h2>

            <form class="pb-3 w-100" style="max-width: 500px;">
                <fieldset>
                    <div>

                        <label for="nome" class="form-label ">Nome:</label>
                        <input type="text" class="form-control " name="txtnome" id="nome" required>

                        <label for="email" class="form-label">E-mail:</label>
                        <input type="email" class="form-control" name="txtemail" id="email" required>

                        <label for="senha" class="form-label">Senha:</label>
                        <input type="password" class="form-control" name="txtsenha" id="senha" required>

                        <label for="comentario" class="form-label">Comentário sobre o site:</label>
                        <textarea id="comentario" class="form-control" name="txtcomentario" rows="3" required
                            style="resize: none;"></textarea>


                        <div>
                            <div class="d-flex  flex-lg-row gap-2 mt-3 mb-3">

                                <legend class="m-0 p-0 w-auto align-self-center" style="font-size: 18px;">Sexo:</legend>

                                <div class=" align-self-center d-flex flex-lg-row flex-column ">

                                    <div>

                                        <input class="form-check-input input" type="radio" id="feminino" name="sexo">
                                        <label class="form-check-label" for="feminino">Feminino</label>

                                    </div>

                                    <div>

                                        <input class="form-check-input input" type="radio" id="masculino" name="sexo">
                                        <label class="form-check-label" for="masculino">Masculino</label>

                                    </div>
                                </div>
                            </div>
                            <div class="form-check">
                                <div>
                                    <input class="form-check-input input" type="checkbox" id="Termos" required>
                                    <label class="form-check-label " for="Termos">Eu aceito os termos e condições</label>
                                </div>

                                <div class="checkbox">
                                    <input class="form-check-input input" type="checkbox" id="faclube" required>
                                    <label class="form-check-label" for="faclube">Concordo em fazer parte do
                                        Fã-clube</label>
                                </div>

                            </div>
                        </div>
                        <div class="mt-2">

                            <button type="submit">Continuar</button>
                            <button type="reset">Cancelar</button>

                        </div>
                    </div>
                </fieldset>
            </form>
        </div>



    </section>






    <footer class="text-center  mt-5  " style="background-color: #f2a2a2; color: #4b3f59; min-height: 350px;">

        <div>

            <img src="../assets/img/CATADVICELOGOSEMFUNDO.png" alt="Logo CatAdvice" width="200" height="200">

        </div>

        <p>CATADVICE é um site sobre curiosidades, dicas e entretenimento sobre o mundo felino.</p>
        <nav class=" container navbar-expand-sm  ">
            <ul class="navbar-nav me-auto justify-content-center pb-2" style="gap: 25px;">
                <li class="nav-item">
                    <a class=" nav-link" href="index.html">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="pages/generos.html">Dicas</a>
                </li>

                <li class="nav-item">
                    <a class=" nav-link" href="pages/Inscrevase.html">Inscreva-se</a>
                </li>
            </ul>


        </nav>
        <p class="m-0 p-0">&copy; 2026 CatAdvice</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
