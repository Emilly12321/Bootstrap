<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Precisa do link correto do local que disponibilza os icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Aprendendo Bootstrap 4.6 no UniSenai</title>
</head>

<body >

    <button type="button" class="btn btn-primary">
        <!-- badge-light foi descontinuado na versao 5 -->
        Profile <span class="badge bg-danger">9</span>
        <!-- sr-only foi descontinuado na versao 5 -->
        <span class="visually-hidden">unread messages</span>
    </button>

    <br>
    <!-- badge-phill descontinuado -->
    <span class="mt-5 badge rounded-pill bg-primary">Primary</span>
    <span class="mt-5 badge bg-secondary">Secondary</span>
    <span class="mt-5 badge bg-success">Succes</span>
    <span class="mt-5 badge bg-danger">Danger</span>
    <span class="mt-5 badge bg-warning">Warning</span>
    <span class="mt-5 badge bg-info">Info</span>
    <span class="mt-5 badge bg-light text-primary">Light</span>
    <span class="mt-5 badge rounded-pill bg-dark">Dark</span>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
