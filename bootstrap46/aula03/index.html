<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Aprendendo Bootstrap 4.6 no UniSenai</title>

</head>

<body>

    <button class="btn btn-primary">botao</button>
    <button class="btn btn-warning">botao</button>
    <button class="btn btn-link">botao</button>

    <a class="btn btn-primary" href="#">Nosso site</a>
    <br>
    <button class="btn btn-outline-primary">botao</button>
    <br>
    <button class="btn btn-outline-primary">botao</button>

    <button class="btn btn-outline-primary btn-lg">botao</button>
    <br>
    <button class="btn btn-outline-primary btn-samll">botao</button>
    <br>
    <!-- Deprecado, ou seja , a partir da 5 versao nao se utiliza mais a classe btn-block, usando o w-100    -->
    <button class="btn btn-primary w-100">botao</button>

    <br>
    <br>

    <div class="dropdown">
        <!-- Temos que usar a classe data-bs-toggle para ser compativel com a atual versao do bootstrap -->
        <button class="btn btn-primary" data-bs-toggle="dropdown">
            Menu desdobravel
        </button>

        <div class="dropdown-menu">

            <div class="btn-group">
                
                <button class="btn btn-primary">UM</button>
                <button class="btn btn-primary">DOIS</button>
                <button class="btn btn-primary">TRES</button>

            </div>

            <!-- <a href="#" class="dropdown-item">Home</a>
            <a href="#" class="dropdown-item">Sobre</a>
            <a href="#" class="dropdown-item">Contato</a> -->
        </div>




    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
