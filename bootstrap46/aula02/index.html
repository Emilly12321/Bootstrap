<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Aprendendo Bootstrap 4.6 no UniSenai</title>
</head>

<body>
    <!-- Modelo de estilizacao por herarquia de titulo por tag -->
    <h1>Hello, World</h1>
    <h2>Hello, World</h2>
    <h3>Hello, World</h3>
    <h4>Hello, World</h4>
    <h5>Hello, World</h5>
    <h6>Hello, World</h6>

    <!-- Modelo de estilizacao por herarquia de titulo por class -->
    <p class="h1">h1. Hello, World</p>
    <p class="h2">h2. Hello, World</p>
    <p class="h3">h3. Hello, World</p>
    <p class="h4">h4. Hello, World</p>
    <p class="h5">h5. Hello, World</p>
    <p class="h6">h6. Hello, World</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
