<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">


    <link rel="stylesheet" href="   ">


    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #E3E5EB;
        }

        .navbarFundo {
            background-color: #314946;
        }

        .nav-item:active {
            border: 1px #648B87 solid;
        }


        .icons {
            border: 0.1px #E2E6E7 solid;
            background-color: #F5F7FD;
        }

        .userIcon {
            background-color: #648884;
        }

        .status {
            background-color: #6EB384;
        }

        .divAdicionar {
            border-top: 1px solid rgba(141, 149, 214, 0.4);
            border-bottom: 1px solid rgba(141, 149, 214, 0.4);
        }

        .btn_adiconar {
            background-color: #648884;

        }

        .btn_adiconar:hover {
            background-color: #91b9b5;
        }
    </style>

    <title>CatAdvice</title>
</head>

<body>

    <div class="d-flex">

        <nav class="navbar navbar-dark navbarFundo flex-column vh-100 p-3" style="width: 260px;">

            <a class="navbar-brand mb-4" href="#">
                <span class="fw-light fs-2 fst-italic">F</span>utBook
            </a>

            <input class="form-control form-control-sm mb-4" type="search" placeholder="Search...">

            <ul class="navbar-nav flex-column w-100">

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">
                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-bar-chart me-2"></i>
                        Relatório por Período
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-envelope me-2"></i>
                        Solicitações
                    </a>
                </li>

                <li class="nav-item active">
                    <a class="nav-link" href="Quadras.html">
                        <i class="bi bi-geo-alt me-2"></i>
                        Quadras
                    </a>
                </li>

            </ul>

            <!-- Parte de baixo -->
            <ul class="navbar-nav flex-column mt-auto w-100">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-gear me-2"></i>
                        Configuração
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Sair
                    </a>
                </li>

            </ul>

        </nav>

        <section class="flex-fill">

            <main class="d-flex ms-auto p-4">
                <h2>Quadras</h2>

                <div class="d-flex flex-row icons ms-auto rounded-4 ps-1 pe-1">

                    <div class="d-flex flex-row  ms-auto rounded-4 ps-1 pe-1">

                        <div class=" align-self-center userIcon text-light rounded-circle ">
                            <i class=" bi bi-person fs-4 p-2 "></i>
                        </div>
                    </div>

            </main>

            <div class="container mt-5 bg-light p-4 rounded-4">

                <div class="row g-4 d-none d-md-flex pb-5">

                    <div class="col-md-3">
                        <div class="card h-100 rounded-4 shadow-sm">
                            <img src="../imgs/Rectangle 1-1.svg" class="card-img-top" alt="">
                            <div class="card-body">
                                <h5 class="card-title">Arena Gol de Ouro</h5>
                                <span class="badge bg-success rounded-pill mb-3">Ativo</span>
                                <div class="d-grid">
                                    <button class="btn btn-dark rounded-pill">Alterar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card h-100 rounded-4 shadow-sm">
                            <img src="../imgs/Rectangle 1-2.svg" class="card-img-top" alt="">
                            <div class="card-body">
                                <h5 class="card-title">Arena Central</h5>
                                <span class="badge bg-success rounded-pill mb-3">Ativo</span>
                                <div class="d-grid">
                                    <button class="btn btn-dark rounded-pill">Alterar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card h-100 rounded-4 shadow-sm">
                            <img src="../imgs/Rectangle 1-3.svg" class="card-img-top" alt="">
                            <div class="card-body">
                                <h5 class="card-title">Arena Sul</h5>
                                <span class="badge bg-success rounded-pill mb-3">Ativo</span>
                                <div class="d-grid">
                                    <button class="btn btn-dark rounded-pill">Alterar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card h-100 rounded-4 shadow-sm">
                            <img src="../imgs/Rectangle 1.svg" class="card-img-top" alt="">
                            <div class="card-body">
                                <h5 class="card-title">Arena Norte</h5>
                                <span class="badge bg-success rounded-pill mb-3">Ativo</span>
                                <div class="d-grid">
                                    <button class="btn btn-dark rounded-pill">Alterar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>


                <div id="cardCarousel" class="carousel slide d-md-none">

                    <div class="carousel-inner">

                        <div class="carousel-item active">
                            <div class="card rounded-4 shadow-sm">
                                <img src="../imgs/Rectangle 1-1.svg" class="card-img-top" alt="">
                                <div class="card-body">
                                    <h5 class="card-title">Arena Gol de Ouro</h5>
                                    <span class="badge bg-success rounded-pill mb-3">Ativo</span>
                                    <div class="d-grid">
                                        <button class="btn btn-dark rounded-pill">Alterar</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="carousel-item">
                            <div class="card rounded-4 shadow-sm">
                                <img src="../imgs/Rectangle 1-2.svg" class="card-img-top" alt="">
                                <div class="card-body">
                                    <h5 class="card-title">Arena Central</h5>
                                    <span class="badge bg-success rounded-pill mb-3">Ativo</span>
                                    <div class="d-grid">
                                        <button class="btn btn-dark rounded-pill">Alterar</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#cardCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon bg-dark rounded-circle"></span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#cardCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon bg-dark rounded-circle"></span>
                    </button>

                </div>

                <div class="text-center divAdicionar pt-3 pb-2">
                    <h6 class="">ADICIONAR NOVA QUADRA</h6>
                </div>
                <form action="../pages/Adicionar.html">

                    <div class="d-grid pt-4 ">

                        <button type="submit" class="btn btn_adiconar text-light rounded-5 h-20">
                            <span class="bi bi-plus"></span>
                        </button>
                    </div>
                </form>
            </div>

        </section>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
