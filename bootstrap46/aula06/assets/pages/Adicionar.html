<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">


    <link rel="stylesheet" href="   ">


    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #E3E5EB;
        }

        .sectionConteudo{
             margin-left: 250px;
        }

        .navbarFundo {
            min-height: 100%;
            width: 250px;
            background-color: #314946;

        }

        .nav-item a:active {
            border: 1px #648B87 solid;
        }



        .userIcon {
            background-color: #648884;
        }

        .status {
            background-color: #6EB384;
        }

        .divAdicionar {
            border-top: 1px solid rgba(141, 149, 214, 0.4);
            border-bottom: 1px solid rgba(141, 149, 214, 0.4);
        }

        .btn_adiconar {
            background-color: #648884;

        }

        .btn_adiconar:hover {
            background-color: #91b9b5;
        }

        .img {

            object-fit: cover;
        }

        .divImg {
            height: 300px;
        }

        textarea {
            resize: none;
        }


        /* mexendo diretamente no componente do bootstrap */
        .btn-outline-success {
            --bs-btn-bg: rgba(49, 73, 70, 0.5);
            --bs-btn-border-color: rgba(49, 73, 70, 0.5);
            --bs-btn-color: #fff;
            --bs-btn-active-bg: #2e4f4f;
            --bs-btn-active-color: rgba(49, 73, 70, 0.5);
            --bs-btn-active-color: #fff;
        }

        .btn-light {
            --bs-btn-color: #FFFFFF;
            --bs-btn-bg: #648884;
            --bs-btn-border-color: #2e4f4f;
            --bs-btn-hover-color: #FFFFFF;
            --bs-btn-hover-bg: rgba(48, 77, 73, 0.986);
            --bs-btn-hover-border-color: #c6c7c8;
        }
    </style>

    <title>Futbook</title>
</head>

<body>

    <div class="d-flex">

        <nav class="navbar navbar-dark navbarFundo flex-column p-3 position-fixed top-0 start-0 ">

            <a class="navbar-brand mb-4" href="#">
                <span class="fw-light fs-2 fst-italic">F</span>utBook
            </a>

            <input class="form-control form-control-sm mb-4" type="search" placeholder="Search...">

            <ul class="navbar-nav flex-column w-100">

                <li class="nav-item ">
                    <a class="nav-link" href="dashboard.html">
                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-bar-chart me-2"></i>
                        Relatório por Período
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-envelope me-2"></i>
                        Solicitações
                    </a>
                </li>

                <li class="nav-item active">
                    <a class="nav-link" href="Quadras.html">
                        <i class="bi bi-geo-alt me-2"></i>
                        Quadras
                    </a>
                </li>

            </ul>

            <ul class="navbar-nav flex-column mt-auto w-100">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-gear me-2"></i>
                        Configuração
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="../../index.html">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Sair
                    </a>
                </li>

            </ul>

        </nav>

        <section class="flex-fill p-4 sectionConteudo">

            <main class="d-flex ms-auto gap-2 p-4">
                <h2>Servicos</h2>

                <div class="d-flex flex-row ms-auto rounded-4 ps-1 pe-1">

                    <div class="d-flex flex-row  ms-auto rounded-4 ps-1 pe-1">

                        <div class=" align-self-center userIcon text-light rounded-circle ">
                            <i class=" bi bi-person fs-4 p-2 "></i>
                        </div>
                    </div>

            </main>
            <div class="container mt-5 mb-5">
                <form action="../pages/Quadras.html" class="d-flex flex-column">
                    <fieldset>

                        <div class="row g-4">

                            <div class="col-12">
                                <div class="rounded-4 shadow-sm overflow-hidden divImg">
                                    <img src="../imgs/Rectangle 610.svg" class="w-100 h-100" style="object-fit: cover;"
                                        alt="">
                                </div>
                            </div>

                            <div class="col-12 col-md-3">
                                <div class="rounded-4 shadow-sm overflow-hidden ratio ratio-1x1">
                                    <img src="../imgs/Rectangle 1-1.svg" class="w-100 h-100" style="object-fit: cover;"
                                        alt="">
                                </div>
                            </div>

                            <div class="col-12 col-md-3">
                                <div class="rounded-4 shadow-sm overflow-hidden ratio ratio-1x1">
                                    <img src="../imgs/Rectangle 1-2.svg" class="w-100 h-100" style="object-fit: cover;"
                                        alt="">
                                </div>
                            </div>

                            <div class="col-12 col-md-3">
                                <div class="rounded-4 shadow-sm overflow-hidden ratio ratio-1x1">
                                    <img src="../imgs/Rectangle 1-2.svg" class="w-100 h-100" style="object-fit: cover;"
                                        alt="">
                                </div>
                            </div>

                            <div class="col-12 col-md-3">
                                <div class="rounded-4 shadow-sm overflow-hidden ratio ratio-1x1">
                                    <img src="../imgs/Rectangle 1.svg" class="w-100 h-100" style="object-fit: cover;"
                                        alt="">
                                </div>
                            </div>

                        </div>

                        <div class="mt-5">

                            <h3 class="">INFORMACOES SOBRE O LOCAL</h3>

                            <div class="row g-4">

                                <div class="col-12 col-md-6">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" id="nome" class="form-control rounded-4">
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="whatsapp" class="form-label">Whatsapp</label>
                                    <input type="text" id="whatsapp" class="form-control rounded-4">
                                </div>

                            </div>

                            <div class="row g-4 pt-2">

                                <div class="col-12 col-md-6">
                                    <label for="nome" class="form-label">Enderco</label>
                                    <input type="text" id="endereco" class="form-control rounded-4">
                                </div>

                                <div class="col-12 col-md-6">

                                    <label for="status" class="form-label">Situacao do Local</label>


                                    <div class=" container-fluid d-flex flex-lg-row flex-column">

                                        <div class="pe-3">

                                            <input class="form-check-input" type="radio" id="Ativo" name="ativo">
                                            <label class="form-check-label" for="Ativo">Ativo</label>

                                        </div>

                                        <div>

                                            <input class="form-check-input" type="radio" id="Inativo" name="inativo">
                                            <label class="form-check-label" for="Inativo">Inativo</label>

                                        </div>
                                    </div>
                                </div>

                                <div class="container-fluid mt-4">

                                    <label for="descricao" class="form-label">Descricao do Local:</label>
                                    <textarea id="descricao" class="form-control" name="txtdescricao" rows="5"
                                        required></textarea>

                                </div>


                                <div class="container-fluid mt-3">

                                    <h3>Disponibilidade do Local: </h3>

                                    <div class="container-fluid pt-2 ">

                                        <label for="diasSemanas" class="form-label">Dias da Semana:</label>


                                        <div class="d-flex flex-wrap justify-content-between gap-2 pt-1">

                                            <input type="checkbox" class="btn-check" id="segunda_feira"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="segunda_feira">Segunda-feira</label>

                                            <input type="checkbox" class="btn-check" id="terceira_feira"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="terceira_feira">Terça-feira</label>

                                            <input type="checkbox" class="btn-check" id="quarta_feira"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="quarta_feira">Quarta-feira</label>


                                            <input type="checkbox" class="btn-check" id="quinta_feira"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="quinta_feira">Quinta-feira</label>

                                            <input type="checkbox" class="btn-check" id="sexta_feira"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="sexta_feira">Sexta-feira</label>

                                            <input type="checkbox" class="btn-check" id="feriados" autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="feriados">Feriados</label>

                                        </div>


                                    </div>

                                    <div class="container-fluid pt-4">

                                        <label for="horasAtendimento" class="form-label">Horário de Atendimento:</label>

                                        <div class=" row align-items-center g-2">

                                            <div class="col-12 col-md-auto">

                                                <input type="time" class="form-control rounded-pill" id="inicioTempo">

                                            </div>

                                            <div class="col-12 col-md-auto text-center">

                                                <span>Até</span>

                                            </div>

                                            <div class="col-12 col-md-auto">

                                                <input type="time" id="finalTempo" class="form-control rounded-pill">

                                            </div>

                                        </div>

                                    </div>

                                    <div class="container-fluid pt-3">

                                        <label for="diasSemanas" class="form-label">Benefício do local:</label>


                                        <div class="d-flex justify-content-between gap-2 pt-2 flex-wrap ">

                                            <input type="checkbox" class="btn-check" id="espacoKids" autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill "
                                                for="espacoKids">Espaço Kids</label>

                                            <input type="checkbox" class="btn-check" id="churrasqueira"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="churrasqueira">Churrasqueira</label>

                                            <input type="checkbox" class="btn-check" id="lanchonetes"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="lanchonetes">Lanchonetes</label>

                                            <input type="checkbox" class="btn-check" id="itensEsportivos"
                                                autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="itensEsportivos">Itens de Esporte</label>


                                            <input type="checkbox" class="btn-check" id="vestiarios" autocomplete="off">
                                            <label class="btn btn-outline-success rounded-pill flex-fill"
                                                for="vestiarios">Vestiários</label>



                                        </div>


                                    </div>
                                    <div class="text-center">

                                        <div class="d-grid pt-5 pb-2">

                                            <button type="submit" class="btn btn-light rounded-5 ">Adicionar</button>

                                        </div>

                                        <button type="submit"
                                            class="btn rounded-5 text-decoration-underline">Descartar</button>
                                    </div>
                                </div>

                    </fieldset>

                </form>

            </div>



        </section>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
